    body {

    .container {

    }

    .card {
      border: 1px solid black;

      border-bottom: 1px solid #0000ff;
    }

    .card p {
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      border-top: 2px solid black;
      background-color: #ffffff;
    }
    .iframe-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap; 
      gap: 10px; 
      margin-top: 20px;
    }
    @font-face {

<body>

  <footer>THANK YOU TELSTRA CREATOR SPACE 4 THE FACILITIES<br>+ THANK YOU TO XITANG ZHAO, THE X LAB, MEGCELL + THE NEO STUDIOS, FOR THE FOLLOWING ARDUINO CONTENT THAT THOROUGHLY ENTERTAINED ME.</footer>

  <script>
  const data = [
    {
      title: "UNO R3 CONTROLLER BOARD x 1PC",
      description: "a microcontroller used to build and control electronic projects like sensors, motors, and lights",
      image: "images/arduino.png"
    },
    {
      title: "LDC1602 MODULE (with pin header)",
      description: "an LCD display used to show text or data from a microcontroller like the Arduino",
      image: "images/LCDmodule.png"
    },
    {
      title: "ULTRASONIC SENSOR",
      description: "measures distance by sending out ultrasonic waves and calculating the time it takes for the sound to bounce back from an object.",
      image: "images/ultrasonicsensor.png"
    },
    {
      title: "DHT11 TEMPERATURE AND HUMIDITY MODULE x 1PC",
      description: "measures the surrounding air's temperature and humidity levels.",
      image: "images/temperaturemodule.png"
    },
    {
      title: "ACTIVE BUZZER",
      description: "the active buzzer is a component that produces sound when powered.  used to create audio signals without needing complex code to generate the sound.",
      image: "images/activebuzzer.png"
    }
  ];

  const container = document.getElementById('cardContainer');

  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';

    let cardContent = '';
    if (item.image) {
      cardContent += `<img src="${item.image}" alt="${item.title}" style="width:150px; display:block; margin-bottom:10px;">`;
    }
    cardContent += `<h3>${item.title}</h3><p>${item.description}</p>`;
    card.innerHTML = cardContent;

    container.appendChild(card);
  });
</script>
